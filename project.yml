name: iChart

options:
  bundleIdPrefix: com.ichart
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: N6G8X4K46U
    MARKETING_VERSION: "1.2.1"
    CURRENT_PROJECT_VERSION: "63"
    TARGETED_DEVICE_FAMILY: "2"
    SWIFT_VERSION: "5.10"
    ALWAYS_SEARCH_USER_PATHS: false
    SUPPORTS_MACCATALYST: false
  configs:
    Debug:
      ENABLE_TESTABILITY: true
      ONLY_ACTIVE_ARCH: true
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: Apple Development

fileGroups:
  - StoreKit

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0

targets:
  iChart:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        PRODUCT_NAME: iChart
        PRODUCT_BUNDLE_IDENTIFIER: com.ichart.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPABASE_URL: https://pausvvwoazbvmzyrebwl.supabase.co
        SUPABASE_PUBLISHABLE_KEY: sb_publishable_ZyyagOMS_Dfyf9pASisrtQ_9Dei0_x7
        SUPABASE_ANON_KEY: ""
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: iChart App Store
    info:
      path: iChart/App/Info.plist
      properties:
        CFBundleDisplayName: iChart
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: com.ichart.app.auth
            CFBundleURLSchemes:
              - ichart
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        SupabaseURL: "$(SUPABASE_URL)"
        SupabasePublishableKey: "$(SUPABASE_PUBLISHABLE_KEY)"
        SupabaseAnonKey: "$(SUPABASE_ANON_KEY)"
    sources:
      - path: iChart
        excludes:
          - Resources
          - App/RecognitionStudyApp.swift
          - Features/RecognitionStudy
      - path: iChart/Resources
        buildPhase: resources
      - path: ThirdParty/NotationFonts/SMuFL
        buildPhase: resources
        excludes:
          - "**/metadata.json"
    dependencies:
      - package: Supabase
        product: Supabase
    postBuildScripts:
      - path: scripts/embed_personal_comparison.sh
        name: Embed opted-in Debug personal ML comparison
        basedOnDependencyAnalysis: false
        showEnvVars: false
  iChartTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        PRODUCT_NAME: iChartTests
        PRODUCT_BUNDLE_IDENTIFIER: com.ichart.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/iChart.app/iChart"
        BUNDLE_LOADER: "$(TEST_HOST)"
    sources:
      - path: iChartTests
        excludes:
          - "**/README.md"
    dependencies:
      - target: iChart
  RecognitionStudy:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        PRODUCT_NAME: RecognitionStudy
        PRODUCT_BUNDLE_IDENTIFIER: com.ichart.recognitionstudy
    info:
      path: iChart/Features/RecognitionStudy/Info.plist
      properties:
        CFBundleDisplayName: Recognition Study
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: iChart/App/RecognitionStudyApp.swift
      - path: iChart/Recognition/InkTrajectoryTypes.swift
      - path: iChart/Recognition/ChordInkCanonicalTrajectoryPacket.swift
      - path: iChart/Recognition/PencilKitInkAdapter.swift
      - path: iChart/Recognition/Learned/ChordInkFeatureSchema.swift
      - path: iChart/Recognition/Learned/ChordInkTrajectoryFeatureEncoder.swift
      - path: iChart/Recognition/Learned/ChordInkRasterizer.swift
      - path: iChart/Recognition/Learned/ChordInkLearnedFactorOutput.swift
      - path: iChart/Recognition/Learned/ChordInkModelArtifactManifest.swift
      - path: iChart/Recognition/Learned/ChordInkCompositionalDecoder.swift
      - path: iChart/Recognition/Learned/ChordInkLearnedRuntime.swift
      - path: iChart/Recognition/Learned/ChordInkCoreMLAdapter.swift
      - path: iChart/Shared/ChordNotation/ChordNotation.swift
      - path: iChart/Shared/ChordNotation/ChordNotationGrammar.swift
      - path: iChart/Features/RecognitionStudy/RecognitionStudyCanonicalValues.swift
      - path: iChart/Features/RecognitionStudy/RecognitionStudyCaptureGrant.swift
      - path: iChart/Features/RecognitionStudy/RecognitionStudyAuthorizedCaptureModels.swift
      - path: iChart/Features/RecognitionStudy/RecognitionStudyCaptureTransportModels.swift
      - path: iChart/Features/RecognitionStudy/RecognitionStudyCaptureHTTPClient.swift
      - path: iChart/Features/RecognitionStudy/RecognitionStudyPendingCaptureUploadStore.swift
      - path: iChart/Features/RecognitionStudy/RecognitionStudyCaptureUploadCoordinator.swift
      - path: iChart/Features/RecognitionStudy/RecognitionStudyConsentModels.swift
      - path: iChart/Features/RecognitionStudy/RecognitionStudyConsentHTTPClient.swift
      - path: iChart/Features/RecognitionStudy/RecognitionStudyConsentWithdrawalCoordinator.swift
      - path: iChart/Features/RecognitionStudy/RecognitionStudyCaptureModels.swift
      - path: iChart/Features/RecognitionStudy/RecognitionStudyLocalCaptureStore.swift
      - path: iChart/Features/RecognitionStudy/RecognitionStudyOutcomeModels.swift
      - path: iChart/Features/RecognitionStudy/RecognitionStudyLocalOutcomeStore.swift
      - path: iChart/Features/RecognitionStudy/RecognitionStudyCanvasView.swift
      - path: iChart/Features/RecognitionStudy/RecognitionStudyCaptureView.swift
      - path: iChart/Features/RecognitionStudy/RecognitionStudyVisionChordRecognizer.swift
      - path: iChart/Features/RecognitionStudy/RecognitionStudyVisionResultProvider.swift
      - path: iChart/Features/RecognitionStudy/RecognitionStudyLearnedResultProvider.swift
  RecognitionStudyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        PRODUCT_NAME: RecognitionStudyTests
        PRODUCT_BUNDLE_IDENTIFIER: com.ichart.recognitionstudy.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RecognitionStudy.app/RecognitionStudy"
        BUNDLE_LOADER: "$(TEST_HOST)"
    sources:
      - path: iChartStudyTests
    dependencies:
      - target: RecognitionStudy

schemes:
  iChart:
    build:
      targets:
        iChart: all
    run:
      config: Debug
      storeKitConfiguration: StoreKit/iChartProSubscriptions.storekit
    test:
      targets:
        - iChartTests
  RecognitionStudy:
    build:
      targets:
        RecognitionStudy: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RecognitionStudyTests
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Debug
