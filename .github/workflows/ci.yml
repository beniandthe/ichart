name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:
    inputs:
      run_recognition_research:
        description: "Also run parked Recognition Study and Python/Core ML contracts"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  telemetry-contracts:
    name: Content-free telemetry contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify client and ingest allowlists agree
        run: node --test supabase/functions/_shared/telemetry_ingest.test.mjs

  swift-package:
    name: SwiftPM tests
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Detect app-impacting changes
        id: app_changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            changed_files="$(git diff --name-only "origin/${{ github.base_ref }}" HEAD)"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.repository.default_branch }}:refs/remotes/origin/${{ github.event.repository.default_branch }}"
            changed_files="$(git diff --name-only "origin/${{ github.event.repository.default_branch }}" HEAD)"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            if ! changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null)"; then
              changed_files="$(git ls-files)"
            fi
          else
            changed_files="$(git ls-files)"
          fi

          printf '%s\n' "$changed_files"

          if printf '%s\n' "$changed_files" | grep -Eq '^(iChart/|iChartTests/|ThirdParty/|scripts/|Package.swift|Package.resolved|project.yml|\.github/workflows/ci.yml|\.github/scripts/)'; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report skipped SwiftPM tests
        if: steps.app_changes.outputs.run_tests != 'true'
        run: echo "No app-impacting files changed; SwiftPM tests are skipped for this documentation/config-only pass."

      - name: Show toolchain
        if: steps.app_changes.outputs.run_tests == 'true'
        run: |
          swift --version
          xcodebuild -version

      - name: Run Swift package tests
        if: steps.app_changes.outputs.run_tests == 'true'
        run: swift test

  ios-simulator:
    name: iOS simulator tests
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Detect app-impacting changes
        id: app_changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            changed_files="$(git diff --name-only "origin/${{ github.base_ref }}" HEAD)"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.repository.default_branch }}:refs/remotes/origin/${{ github.event.repository.default_branch }}"
            changed_files="$(git diff --name-only "origin/${{ github.event.repository.default_branch }}" HEAD)"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            if ! changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null)"; then
              changed_files="$(git ls-files)"
            fi
          else
            changed_files="$(git ls-files)"
          fi

          printf '%s\n' "$changed_files"

          if printf '%s\n' "$changed_files" | grep -Eq '^(iChart/|iChartTests/|ThirdParty/|scripts/|Package.swift|Package.resolved|project.yml|\.github/workflows/ci.yml|\.github/scripts/)'; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report skipped iOS simulator tests
        if: steps.app_changes.outputs.run_tests != 'true'
        run: echo "No app-impacting files changed; iOS simulator tests are skipped for this documentation/config-only pass."

      - name: Show toolchain
        if: steps.app_changes.outputs.run_tests == 'true'
        run: |
          swift --version
          xcodebuild -version

      - name: Install XcodeGen
        if: steps.app_changes.outputs.run_tests == 'true'
        run: .github/scripts/install-xcodegen.sh

      - name: Generate Xcode project
        if: steps.app_changes.outputs.run_tests == 'true'
        run: xcodegen generate

      - name: Select iPad simulator
        if: steps.app_changes.outputs.run_tests == 'true'
        run: .github/scripts/select-ipad-simulator.sh

      - name: Run iChart Xcode tests
        if: steps.app_changes.outputs.run_tests == 'true'
        run: |
          xcodebuild test \
            -project iChart.xcodeproj \
            -scheme iChart \
            -destination "$SIMULATOR_DESTINATION" \
            -resultBundlePath "$RUNNER_TEMP/iChart.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify app tests actually executed
        if: steps.app_changes.outputs.run_tests == 'true'
        run: |
          xcrun xcresulttool get test-results summary \
            --path "$RUNNER_TEMP/iChart.xcresult" > "$RUNNER_TEMP/iChart-summary.json"
          python3 - "$RUNNER_TEMP/iChart-summary.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as source:
              summary = json.load(source)
          passed = summary.get("passedTests", 0)
          failed = summary.get("failedTests", 0)
          skipped = summary.get("skippedTests", 0)
          print(f"App tests: {passed} passed, {failed} failed, {skipped} skipped")
          if summary.get("result") != "Passed" or passed < 1 or failed != 0:
              raise SystemExit("App validation requires executed, passing tests.")
          PY

      - name: Upload Xcode result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-xcresults
          path: |
            ${{ runner.temp }}/iChart.xcresult
            ${{ runner.temp }}/iChart-summary.json
          if-no-files-found: ignore
          retention-days: 7

  recognition-research:
    name: Optional parked recognition research contracts
    if: github.event_name == 'workflow_dispatch' && inputs.run_recognition_research
    runs-on: macos-26
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Install XcodeGen
        run: .github/scripts/install-xcodegen.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select iPad simulator
        run: .github/scripts/select-ipad-simulator.sh

      - name: Run Recognition Study Xcode tests
        run: |
          xcodebuild test \
            -project iChart.xcodeproj \
            -scheme RecognitionStudy \
            -destination "$SIMULATOR_DESTINATION" \
            -resultBundlePath "$RUNNER_TEMP/RecognitionStudy.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Set up pinned Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: recognition_ml/pyproject.toml

      - name: Install pinned recognition toolchain
        run: python -m pip install -e './recognition_ml[export]'

      - name: Run full recognition ML suite
        env:
          PYTHONPATH: recognition_ml:recognition_ml/tests
        run: python -m unittest discover -s recognition_ml/tests -v

      - name: Run Python to Core ML to Swift bridge
        env:
          ICHART_RECOGNITION_PYTHON: python
        run: scripts/run_coreml_cross_runtime_gate.sh

      - name: Upload research Xcode result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: recognition-research-xcresults
          path: ${{ runner.temp }}/RecognitionStudy.xcresult
          if-no-files-found: ignore
          retention-days: 7
