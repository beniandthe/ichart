name: DigitalInkProbe
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    PRODUCT_NAME: $(TARGET_NAME)
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ALWAYS_SEARCH_USER_PATHS: false
    CLANG_ENABLE_MODULES: true
    ENABLE_TESTABILITY: true
    SWIFT_OPTIMIZATION_LEVEL: -Onone
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: "2"
targets:
  DigitalInkProbe:
    type: application
    platform: iOS
    sources: [App.swift, ProbeEngine.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ichart.development.digitalinkprobe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
  DigitalInkProbeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ProbeTests.swift]
    dependencies:
      - target: DigitalInkProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ichart.development.digitalinkprobe.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DigitalInkProbe:
    build:
      targets:
        DigitalInkProbe: all
    test:
      targets: [DigitalInkProbeTests]
      environmentVariables:
        PROBE_INPUT: $(PROBE_INPUT)
        PROBE_OUTPUT: $(PROBE_OUTPUT)
