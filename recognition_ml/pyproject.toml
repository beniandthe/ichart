[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ichart-recognition-ml"
version = "0.1.0"
description = "Fail-closed contracts for writer-independent iChart chord-recognition research"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
training = [
    "numpy>=1.24",
    "torch>=2.2",
]
export = [
    "numpy>=1.24",
    "torch>=2.2",
    "coremltools>=8.0",
]

[project.scripts]
ichart-recognition-ml = "ichart_recognition_ml.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["ichart_recognition_ml*"]
